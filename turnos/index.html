<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turnos">
<title>Turnos de trabajo</title>
<style>
  :root {
    --bg: #f4f6fa;
    --header: #1a56a0;
    --card: #ffffff;
    --line: #e2e8f0;
    --text: #1f2937;
    --muted: #6b7280;
    --zebra: #f8fafc;
    --hl: #fff7cc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--header);
    color: #fff;
    padding: 16px 18px;
    position: sticky; top: 0; z-index: 5;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }

  .toolbar {
    max-width: 1100px; margin: 14px auto 0; padding: 0 14px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  #buscador {
    flex: 1; min-width: 180px;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; font-size: 16px; outline: none; background: #fff;
  }
  #buscador:focus { border-color: var(--header); }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 10px; padding: 11px 14px; font-size: 14px; cursor: pointer;
  }
  .btn:active { transform: scale(.97); }

  .wrap { max-width: 1100px; margin: 12px auto 40px; padding: 0 14px; }
  .tabla-cont {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    overflow: auto; -webkit-overflow-scrolling: touch; max-height: 75vh;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 11px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  thead th {
    background: #eef2f8; color: #334155; font-weight: 700;
    position: sticky; top: 0; z-index: 3;
  }
  /* Primera columna fija */
  th:first-child, td:first-child {
    position: sticky; left: 0; z-index: 2;
    background: var(--card); font-weight: 600;
    box-shadow: 1px 0 0 var(--line);
  }
  thead th:first-child { z-index: 4; background: #eef2f8; }
  tbody tr:nth-child(even) td { background: var(--zebra); }
  tbody tr:nth-child(even) td:first-child { background: #eef1f6; }
  tr.oculto { display: none; }
  td.hit, td.hit:first-child { background: var(--hl) !important; }

  .estado { padding: 30px 14px; text-align: center; color: var(--muted); font-size: 15px; }
  .actualizado { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <header>
    <h1>📅 Turnos de trabajo</h1>
    <div class="sub">Consulta de solo lectura · se actualiza al recargar</div>
  </header>

  <div class="toolbar">
    <input id="buscador" type="search" placeholder="🔎 Busca tu nombre o un turno..." oninput="filtrar()">
    <button class="btn" onclick="recargar()">↻ Actualizar</button>
  </div>

  <div class="wrap">
    <div class="tabla-cont">
      <div class="estado" id="estado">Cargando turnos…</div>
      <table id="tabla" style="display:none">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="actualizado" id="actualizado"></div>
  </div>

<script>
  const CSV = 'turnos.csv';

  function parseCSV(texto) {
    texto = texto.replace(/^﻿/, '');               // quita BOM
    const lineas = texto.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
    if (!lineas.length) return [];
    // Detecta separador en la primera línea (; o ,)
    const sep = (lineas[0].split(';').length >= lineas[0].split(',').length) ? ';' : ',';
    return lineas.map(linea => {
      const campos = []; let actual = ''; let entreComillas = false;
      for (let i = 0; i < linea.length; i++) {
        const c = linea[i];
        if (c === '"') {
          if (entreComillas && linea[i + 1] === '"') { actual += '"'; i++; }
          else entreComillas = !entreComillas;
        } else if (c === sep && !entreComillas) {
          campos.push(actual); actual = '';
        } else { actual += c; }
      }
      campos.push(actual);
      return campos.map(s => s.trim());
    });
  }

  function pintar(filas) {
    const thead = document.getElementById('thead');
    const tbody = document.getElementById('tbody');
    const cab = filas[0];
    thead.innerHTML = '<tr>' + cab.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
    tbody.innerHTML = filas.slice(1).map(fila =>
      '<tr>' + cab.map((_, i) => `<td>${esc(fila[i] || '')}</td>`).join('') + '</tr>'
    ).join('');
    document.getElementById('estado').style.display = 'none';
    document.getElementById('tabla').style.display = 'table';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function filtrar() {
    const q = document.getElementById('buscador').value.trim().toLowerCase();
    document.querySelectorAll('#tbody tr').forEach(tr => {
      let hay = false;
      tr.querySelectorAll('td').forEach(td => {
        td.classList.remove('hit');
        if (q && td.textContent.toLowerCase().includes(q)) { td.classList.add('hit'); hay = true; }
      });
      tr.classList.toggle('oculto', q !== '' && !hay);
    });
  }

  function recargar() { cargar(); }

  function cargar() {
    const estado = document.getElementById('estado');
    estado.style.display = 'block';
    estado.className = 'estado';
    estado.textContent = 'Cargando turnos…';
    document.getElementById('tabla').style.display = 'none';
    // cache-busting para ver siempre la última versión
    fetch(CSV + '?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('No se encontró el archivo de turnos (' + r.status + ')');
        const lm = r.headers.get('last-modified');
        if (lm) {
          const f = new Date(lm);
          document.getElementById('actualizado').textContent =
            'Última actualización: ' + f.toLocaleDateString('es-ES', {day:'2-digit', month:'long', year:'numeric'}) +
            ', ' + f.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }
        return r.text();
      })
      .then(t => {
        const filas = parseCSV(t);
        if (filas.length < 2) throw new Error('El archivo de turnos está vacío.');
        pintar(filas);
        filtrar();
      })
      .catch(e => {
        estado.className = 'estado error';
        estado.textContent = '⚠️ ' + e.message;
      });
  }

  cargar();
</script>
</body>
</html>
