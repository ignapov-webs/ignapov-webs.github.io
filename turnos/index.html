<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MamaPlan">
<title>MamaPlan</title>
<style>
  :root {
    --bg: #f4f6fa;
    --header: #1a56a0;
    --card: #ffffff;
    --line: #d7dee8;
    --text: #1f2937;
    --muted: #6b7280;
    --zebra: #f7f9fc;
    --hl: #fff3b0;
    --finde: #fde8e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--header); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }

  .toolbar { max-width: 1400px; margin: 12px auto 0; padding: 0 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #buscador { flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; font-size: 16px; outline: none; background: #fff; }
  #buscador:focus { border-color: var(--header); }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 10px; padding: 10px 13px; font-size: 14px; cursor: pointer; }
  .btn:active { transform: scale(.97); }

  .wrap { max-width: 1400px; margin: 12px auto 36px; padding: 0 12px; }
  .estado { padding: 36px 14px; text-align: center; color: var(--muted); font-size: 15px; }
  .estado.error { color: #b91c1c; }
  .actualizado { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }

  .tabla-cont { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: auto; -webkit-overflow-scrolling: touch; max-height: 80vh; }
  table { border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  td, th { border: 1px solid var(--line); padding: 5px 9px; text-align: center; min-width: 34px; }
  /* La primera fila (cabeceras) pegada arriba */
  tr:first-child td, tr:first-child th { position: sticky; top: 0; background: #e8eef7; font-weight: 700; z-index: 6; }
  tr:nth-child(2) td, tr:nth-child(2) th { position: sticky; top: 28px; background: #eef2f8; font-weight: 600; z-index: 6; }
  /* Primera columna (fecha) pegada a la izquierda */
  td:first-child, th:first-child { position: sticky; left: 0; background: var(--card); font-weight: 600; text-align: left; z-index: 5; box-shadow: 1px 0 0 var(--line); min-width: 92px; }
  tr:first-child td:first-child, tr:nth-child(2) td:first-child { z-index: 8; background: #e8eef7; }
  tbody tr:nth-child(even) td { background: var(--zebra); }
  .hit { background: var(--hl) !important; outline: 2px solid #eab308; }
  td:empty { background: inherit; }
  mark { background: var(--hl); padding: 0; }

  /* Guardias de la unidad de mama importadas (columnas Gdia. / Ste.) */
  td.g-mama { background: #d1fae5 !important; font-weight: 700; color: #065f46; }
</style>
</head>
<body>
  <header>
    <h1>📅 MamaPlan <span id="hdrAnio"></span>— Cirugía General</h1>
    <div class="sub">Consulta de solo lectura · se actualiza al recargar</div>
  </header>

  <div class="toolbar">
    <input id="buscador" type="search" placeholder="🔎 Busca una fecha, código o turno..." oninput="filtrar()">
    <button class="btn" onclick="cargar()">↻ Actualizar</button>
  </div>

  <div class="wrap">
    <div class="estado" id="estado">Cargando el plan…</div>
    <div class="tabla-cont" id="cont" style="display:none"></div>
    <div class="actualizado" id="actualizado"></div>
  </div>

<script src="xlsx.full.min.js"></script>
<script>
  const ARCHIVOS = ['plan.xlsx', 'plan.xls'];   // acepta cualquiera de los dos (sube el que prefieras)
  const HOJA = 'General';                        // hoja a mostrar
  let anioPlan = new Date().getFullYear();       // año del plan (se detecta del propio archivo al cargar)
  // Personas que ya no están en plantilla (jubilaciones, bajas definitivas): se elimina su columna
  // entera de la tabla, identificándolas por su letra en la subcabecera (2ª fila). P. ej. Armendáriz.
  const OCULTAR_PERSONAS = ['A'];                 // A = Armendáriz (jubilado en julio 2026)

  // Prueba los nombres candidatos y devuelve la primera respuesta válida
  function buscarArchivo(i) {
    if (i >= ARCHIVOS.length) throw new Error('No se encontró el archivo del plan. Sube plan.xlsx o plan.xls a la carpeta turnos.');
    return fetch(ARCHIVOS[i] + '?t=' + Date.now()).then(r => r.ok ? r : buscarArchivo(i + 1));
  }

  function cargar() {
    const estado = document.getElementById('estado');
    const cont = document.getElementById('cont');
    estado.style.display = 'block'; estado.className = 'estado'; estado.textContent = 'Cargando el plan…';
    cont.style.display = 'none';

    buscarArchivo(0)
      .then(r => {
        const lm = r.headers.get('last-modified');
        if (lm) {
          const f = new Date(lm);
          document.getElementById('actualizado').textContent =
            'Última actualización: ' + f.toLocaleDateString('es-ES', {day:'2-digit', month:'long', year:'numeric'}) +
            ', ' + f.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }
        return r.arrayBuffer();
      })
      .then(buf => {
        const wb = XLSX.read(buf, { type: 'array', cellStyles: true });
        const hoja = wb.Sheets[HOJA] || wb.Sheets[wb.SheetNames[0]];
        if (!hoja) throw new Error('No se encontró la hoja "' + HOJA + '".');
        reconstruirFechas(hoja);
        ocultarPersonas(hoja, OCULTAR_PERSONAS);
        const refsGuardias = añadirGuardiasMama(hoja);
        const hdr = document.getElementById('hdrAnio');
        if (hdr) hdr.textContent = anioPlan + ' ';   // año detectado del plan, en la cabecera
        // Genera tabla HTML respetando celdas combinadas
        let html = XLSX.utils.sheet_to_html(hoja, { editable: false });
        cont.innerHTML = html;
        pintarColores(cont, hoja);
        refsGuardias.forEach(ref => { const td = document.getElementById('sjs-' + ref); if (td) td.classList.add('g-mama'); });
        estado.style.display = 'none';
        cont.style.display = 'block';
        filtrar();
        irAlMesActual(cont);
      })
      .catch(e => { estado.className = 'estado error'; estado.textContent = '⚠️ ' + e.message; });
  }

  // Letra de la columna de día -> día de la semana de JS (getUTCDay: Dom=0 … Sáb=6)
  const LETRA_A_DIA = { D: 0, L: 1, M: 2, X: 3, J: 4, V: 5, S: 6 };

  // Deduce el año del plan: la primera letra de día indica en qué día de la
  // semana cae el 1 de enero, y se busca el año cercano cuyo 1-ene coincide.
  // Así 2026 (jue), 2027 (vie), etc. se detectan solos sin tocar el código.
  function detectarAnio(hoja) {
    const range = XLSX.utils.decode_range(hoja['!ref']);
    let diaSemana = null;
    for (let R = range.s.r; R <= range.e.r; R++) {
      const cD = hoja[XLSX.utils.encode_cell({ r: R, c: 1 })];
      const letra = cD ? String(cD.v).trim().toUpperCase() : '';
      if (letra in LETRA_A_DIA) { diaSemana = LETRA_A_DIA[letra]; break; }
    }
    const anioActual = new Date().getFullYear();
    if (diaSemana === null) return anioActual;
    // prueba el año actual y los más cercanos (prioriza el actual y el futuro)
    for (let off = 0; off <= 3; off++) {
      for (const a of [anioActual + off, anioActual - off]) {
        if (new Date(Date.UTC(a, 0, 1)).getUTCDay() === diaSemana) return a;
      }
    }
    return anioActual;
  }

  // Reconstruye las fechas reales a partir de la columna de día (consecutiva, empieza el 1-ene del año detectado)
  function reconstruirFechas(hoja) {
    const nom = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']; // día de semana, por getUTCDay()
    const mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    anioPlan = detectarAnio(hoja);
    const ancla = Date.UTC(anioPlan, 0, 1); // 1 de enero del año del plan
    let cont = 0;
    const range = XLSX.utils.decode_range(hoja['!ref']);
    for (let R = range.s.r; R <= range.e.r; R++) {
      const cD = hoja[XLSX.utils.encode_cell({ r: R, c: 1 })];
      const letra = cD ? String(cD.v).trim().toUpperCase() : '';
      if (letra in LETRA_A_DIA) {
        const d = new Date(ancla + cont * 86400000);
        const txt = `${d.getUTCDate()} ${mes[d.getUTCMonth()]} ${nom[d.getUTCDay()]}`;
        const a0 = XLSX.utils.encode_cell({ r: R, c: 0 });
        hoja[a0] = { t: 's', v: txt, w: txt };
        cont++;
      }
    }
  }

  // Guardias de la unidad de mama importadas del plan del servicio (16/10/2026 → feb 2027).
  // Solo se cargan las de 2026; cada entrada es {m, d, l} = mes, día y letras de quien está de guardia
  // ese día. El "saliente" se marca automáticamente al día siguiente. Letras: P=Poveda, S=Sanz,
  // T=Talavera, Ma=Malo. Cuando exista el plan 2027, se añadirán aquí las de enero–febrero 2027.
  const GUARDIAS_MAMA = [
    { m: 10, d: 22, l: ['S'] }, { m: 10, d: 23, l: ['T'] }, { m: 10, d: 24, l: ['P'] },
    { m: 10, d: 26, l: ['Ma'] }, { m: 10, d: 29, l: ['Ma'] },
    { m: 11, d: 1, l: ['S'] }, { m: 11, d: 2, l: ['T'] }, { m: 11, d: 3, l: ['Ma', 'P'] },
    { m: 11, d: 11, l: ['S'] }, { m: 11, d: 12, l: ['T'] }, { m: 11, d: 13, l: ['Ma', 'P'] },
    { m: 11, d: 21, l: ['S'] }, { m: 11, d: 22, l: ['T'] }, { m: 11, d: 23, l: ['Ma', 'P'] },
    { m: 11, d: 30, l: ['P'] },
    { m: 12, d: 1, l: ['S'] }, { m: 12, d: 2, l: ['T'] }, { m: 12, d: 3, l: ['Ma', 'P'] },
    { m: 12, d: 11, l: ['S'] }, { m: 12, d: 12, l: ['T'] }, { m: 12, d: 13, l: ['Ma', 'P'] },
    { m: 12, d: 21, l: ['S'] }, { m: 12, d: 22, l: ['T'] }, { m: 12, d: 23, l: ['Ma', 'P'] },
    { m: 12, d: 31, l: ['S'] },
  ];

  // Localiza la columna cuya cabecera de grupo (1ª fila) es exactamente txt (p. ej. "Gdia.").
  function columnaPorGrupo(hoja, txt) {
    const range = XLSX.utils.decode_range(hoja['!ref']);
    for (let C = range.s.c; C <= range.e.c; C++) {
      const c = hoja[XLSX.utils.encode_cell({ r: 0, c: C })];
      if (c && String(c.v).trim() === txt) return C;
    }
    return -1;
  }

  // Añade un código a una celda sin pisar lo que ya hubiera (los separa con espacio) y conservando su estilo.
  function añadirCodigo(hoja, ref, code) {
    const cell = hoja[ref];
    if (!cell) { hoja[ref] = { t: 's', v: code, w: code }; return; }
    const prev = (cell.v == null ? '' : String(cell.v)).trim();   // celdas con estilo pero sin valor
    const tokens = prev ? prev.split(/\s+/).filter(Boolean) : [];
    if (tokens.includes(code)) return;
    tokens.push(code);
    cell.v = tokens.join(' '); cell.w = cell.v; cell.t = 's';
  }

  // Vuelca las guardias de mama en las columnas "Gdia." (día de guardia) y "Ste." (saliente, día siguiente).
  // Devuelve las referencias de celda tocadas para poder resaltarlas. Solo aplica al plan de 2026.
  function añadirGuardiasMama(hoja) {
    const refs = [];
    if (anioPlan !== 2026) return refs;
    const colG = columnaPorGrupo(hoja, 'Gdia.');
    const colS = columnaPorGrupo(hoja, 'Ste.');
    if (colG < 0 || colS < 0) return refs;
    // mapa ms(UTC) -> fila, con la misma reconstrucción posicional que usa la tabla
    const mapa = new Map();
    const range = XLSX.utils.decode_range(hoja['!ref']);
    const ancla = Date.UTC(anioPlan, 0, 1);
    let cont = 0;
    for (let R = range.s.r; R <= range.e.r; R++) {
      const cD = hoja[XLSX.utils.encode_cell({ r: R, c: 1 })];
      const letra = cD ? String(cD.v).trim().toUpperCase() : '';
      if (letra in LETRA_A_DIA) { mapa.set(ancla + cont * 86400000, R); cont++; }
    }
    GUARDIAS_MAMA.forEach(g => {
      const ms = Date.UTC(2026, g.m - 1, g.d);
      const R = mapa.get(ms);
      if (R !== undefined) {
        const refG = XLSX.utils.encode_cell({ r: R, c: colG });
        g.l.forEach(x => añadirCodigo(hoja, refG, x));
        refs.push(refG);
      }
      // saliente = día siguiente, solo si sigue dentro de 2026
      const msSal = ms + 86400000;
      if (new Date(msSal).getUTCFullYear() === 2026) {
        const Rs = mapa.get(msSal);
        if (Rs !== undefined) {
          const refS = XLSX.utils.encode_cell({ r: Rs, c: colS });
          g.l.forEach(x => añadirCodigo(hoja, refS, x));
          refs.push(refS);
        }
      }
    });
    return refs;
  }

  // Elimina por completo la columna de cada persona indicada (por su letra en la subcabecera, 2ª fila).
  // Útil cuando alguien deja la plantilla (p. ej. una jubilación) y su columna ya no debe mostrarse.
  function ocultarPersonas(hoja, letras) {
    if (!letras || !letras.length) return;
    const range = XLSX.utils.decode_range(hoja['!ref']);
    const objetivo = [];
    for (let C = range.s.c; C <= range.e.c; C++) {
      const cell = hoja[XLSX.utils.encode_cell({ r: 1, c: C })];
      const v = cell ? String(cell.v).trim() : '';
      if (letras.includes(v)) objetivo.push(C);
    }
    // borra de derecha a izquierda para no invalidar los índices aún pendientes
    objetivo.sort((a, b) => b - a).forEach(C => eliminarColumna(hoja, C));
  }

  // Borra una columna de la hoja, desplazando el resto a la izquierda y ajustando !ref y celdas combinadas.
  function eliminarColumna(hoja, delCol) {
    const range = XLSX.utils.decode_range(hoja['!ref']);
    // preserva las etiquetas de grupo (p. ej. "Consultas") ancladas en la columna que se borra
    const preservar = [];
    (hoja['!merges'] || []).forEach(m => {
      if (m.s.c === delCol && m.e.c > delCol) {
        const ref = XLSX.utils.encode_cell({ r: m.s.r, c: delCol });
        if (hoja[ref]) preservar.push({ r: m.s.r, cell: hoja[ref] });
      }
    });
    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = delCol; C <= range.e.c; C++) {
        const dest = XLSX.utils.encode_cell({ r: R, c: C });
        const src = XLSX.utils.encode_cell({ r: R, c: C + 1 });
        if (hoja[src]) hoja[dest] = hoja[src]; else delete hoja[dest];
      }
    }
    preservar.forEach(p => { hoja[XLSX.utils.encode_cell({ r: p.r, c: delCol })] = p.cell; });
    range.e.c = Math.max(range.s.c, range.e.c - 1);
    hoja['!ref'] = XLSX.utils.encode_range(range);
    if (hoja['!merges']) {
      const nuevas = [];
      for (const m of hoja['!merges']) {
        const s = { r: m.s.r, c: m.s.c }, e = { r: m.e.r, c: m.e.c };
        if (s.c === delCol && e.c === delCol) continue;   // merge de una sola columna: desaparece
        if (s.c > delCol) s.c--;
        if (e.c >= delCol) e.c--;
        if (e.c < s.c) continue;
        nuevas.push({ s, e });
      }
      hoja['!merges'] = nuevas;
    }
    if (hoja['!cols']) hoja['!cols'].splice(delCol, 1);
  }

  // Aplica a cada celda su color real del Excel (avisos). Donde no hay color, pinta rosa los findes.
  function pintarColores(cont, hoja) {
    const range = XLSX.utils.decode_range(hoja['!ref']);
    // filas de fin de semana según TU columna de día (col B: S = sábado, D = domingo)
    const finde = {};
    for (let R = range.s.r; R <= range.e.r; R++) {
      const cD = hoja[XLSX.utils.encode_cell({ r: R, c: 1 })];
      const l = cD ? String(cD.v).trim() : '';
      if (l === 'S' || l === 'D') finde[R] = true;
    }
    cont.querySelectorAll('table td, table th').forEach(td => {
      if (!td.id || td.id.indexOf('sjs-') !== 0) return;
      const ref = td.id.slice(4);
      const pos = XLSX.utils.decode_cell(ref);
      const cell = hoja[ref];
      let rgb = cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb;
      if (rgb && rgb.length === 8) rgb = rgb.slice(2);   // ARGB -> RGB
      if (rgb && rgb.toUpperCase() !== 'FFFFFF') {
        td.style.background = '#' + rgb;
        if (luminancia(rgb) < 140) td.style.color = '#fff';   // texto blanco sobre fondo oscuro
      } else if (finde[pos.r]) {
        td.style.background = 'var(--finde)';
      }
    });
  }

  // Desplaza la tabla hasta la primera fila del mes actual (en lugar de quedarse en enero).
  // Solo se aplica si el plan es del año en curso; para un plan de otro año (p. ej. el 2027
  // consultado en 2026) se deja al principio, porque "el mes actual" no existe en ese plan.
  function irAlMesActual(cont) {
    const hoy = new Date();
    if (hoy.getFullYear() !== anioPlan) return;
    const mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const token = ' ' + mes[hoy.getMonth()] + ' ';   // p. ej. " jun "
    const filas = cont.querySelectorAll('table tr');
    for (const tr of filas) {
      const celda = tr.cells && tr.cells[0];
      if (celda && (' ' + celda.textContent + ' ').toLowerCase().includes(token)) {
        // resta el alto de las cabeceras pegadas (~56px) para que la fila quede visible
        const offset = tr.getBoundingClientRect().top - cont.getBoundingClientRect().top + cont.scrollTop - 56;
        cont.scrollTop = Math.max(0, offset);
        return;
      }
    }
  }

  function luminancia(hex) {
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    return 0.299*r + 0.587*g + 0.114*b;
  }

  function filtrar() {
    const q = document.getElementById('buscador').value.trim().toLowerCase();
    const filas = document.querySelectorAll('#cont table tr');
    filas.forEach((tr, idx) => {
      if (idx < 2) { tr.style.display = ''; return; }   // mantener cabeceras
      let hay = false;
      [...tr.cells].forEach(td => {
        td.classList.remove('hit');
        if (q && td.textContent.toLowerCase().includes(q)) { td.classList.add('hit'); hay = true; }
      });
      tr.style.display = (q && !hay) ? 'none' : '';
    });
  }

  cargar();
</script>
</body>
</html>
