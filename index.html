<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Gastos</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #232733;
    --text: #f2f4f8;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --danger: #ff5d5d;
    --ok: #34d399;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 40px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 16px; text-align: center; }
  .total-general {
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    border-radius: 18px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(79,140,255,.25);
  }
  .total-general .label { font-size: 13px; opacity: .85; }
  .total-general .valor { font-size: 38px; font-weight: 700; margin-top: 2px; }

  .form {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  input {
    width: 100%;
    background: var(--card2);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: var(--text);
    font-size: 17px;
    outline: none;
  }
  input::placeholder { color: var(--muted); }
  #importe { font-size: 20px; font-weight: 600; }

  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-btn {
    background: var(--card2);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px 4px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: .15s;
  }
  .cat-btn .ico { font-size: 22px; display: block; margin-bottom: 3px; }
  .cat-btn:active { transform: scale(.95); }
  .cat-btn.sel { border-color: var(--accent); background: #2a3550; }

  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 0; }

  .resumen { margin-bottom: 18px; }
  .resumen h2, .historial h2 { font-size: 15px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .cat-resumen {
    display: flex; align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .cat-resumen .ico { font-size: 22px; margin-right: 12px; }
  .cat-resumen .nombre { flex: 1; font-size: 15px; }
  .cat-resumen .pct { color: var(--muted); font-size: 12px; }
  .cat-resumen .monto { font-weight: 700; font-size: 16px; }

  .item {
    display: flex; align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 11px 14px;
    margin-bottom: 7px;
  }
  .item .ico { font-size: 20px; margin-right: 12px; }
  .item .info { flex: 1; min-width: 0; }
  .item .concepto { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .fecha { font-size: 11px; color: var(--muted); }
  .item .monto { font-weight: 600; margin: 0 10px; }
  .item .del {
    background: none; border: none; color: var(--danger);
    font-size: 20px; cursor: pointer; padding: 4px;
  }
  .vacio { text-align: center; color: var(--muted); padding: 20px; font-size: 14px; }
  .footer { text-align: center; margin-top: 20px; }
  .reset { background: none; border: 1px solid var(--card2); color: var(--muted);
    border-radius: 10px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
  <h1>💰 Mis Gastos</h1>

  <div class="total-general">
    <div class="label">Total gastado</div>
    <div class="valor" id="totalGeneral">0,00 €</div>
  </div>

  <div class="form">
    <div class="row">
      <input id="importe" type="number" inputmode="decimal" placeholder="0,00 €" step="0.01">
    </div>
    <div class="row">
      <input id="concepto" type="text" placeholder="Concepto (ej. Café, Gasolina...)">
    </div>
    <div class="cats" id="cats"></div>
    <p class="hint">Escribe importe y concepto, luego toca una categoría</p>
  </div>

  <div class="resumen">
    <h2>RESUMEN POR CATEGORÍA</h2>
    <div id="resumen"></div>
  </div>

  <div class="historial">
    <h2>HISTORIAL</h2>
    <div id="historial"></div>
  </div>

  <div class="footer">
    <button class="reset" onclick="borrarTodo()">Borrar todo</button>
  </div>

<script>
  const CATEGORIAS = [
    { id: 'comida',     nombre: 'Comida',     ico: '🍔' },
    { id: 'transporte', nombre: 'Transporte', ico: '🚗' },
    { id: 'ocio',       nombre: 'Ocio',       ico: '🎉' },
    { id: 'hogar',      nombre: 'Hogar',      ico: '🏠' },
    { id: 'salud',      nombre: 'Salud',      ico: '💊' },
    { id: 'otros',      nombre: 'Otros',      ico: '📦' },
  ];

  let gastos = JSON.parse(localStorage.getItem('gastos') || '[]');

  const eur = n => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const cat = id => CATEGORIAS.find(c => c.id === id) || CATEGORIAS[5];

  function guardar() { localStorage.setItem('gastos', JSON.stringify(gastos)); }

  function pintarCategorias() {
    document.getElementById('cats').innerHTML = CATEGORIAS.map(c =>
      `<button class="cat-btn" onclick="añadir('${c.id}')">
        <span class="ico">${c.ico}</span>${c.nombre}
      </button>`).join('');
  }

  function añadir(catId) {
    const impInput = document.getElementById('importe');
    const conInput = document.getElementById('concepto');
    const importe = parseFloat(impInput.value.replace(',', '.'));
    const concepto = conInput.value.trim();

    if (!importe || importe <= 0) {
      impInput.focus();
      impInput.style.outline = '2px solid var(--danger)';
      setTimeout(() => impInput.style.outline = 'none', 800);
      return;
    }

    gastos.unshift({
      id: Date.now(),
      importe,
      concepto: concepto || cat(catId).nombre,
      categoria: catId,
      fecha: new Date().toISOString()
    });
    guardar();
    impInput.value = '';
    conInput.value = '';
    impInput.focus();
    render();
  }

  function borrar(id) {
    gastos = gastos.filter(g => g.id !== id);
    guardar();
    render();
  }

  function borrarTodo() {
    if (gastos.length && confirm('¿Borrar TODOS los gastos? No se puede deshacer.')) {
      gastos = [];
      guardar();
      render();
    }
  }

  function render() {
    const total = gastos.reduce((s, g) => s + g.importe, 0);
    document.getElementById('totalGeneral').textContent = eur(total);

    // Resumen por categoría
    const porCat = {};
    gastos.forEach(g => porCat[g.categoria] = (porCat[g.categoria] || 0) + g.importe);
    const resumenOrden = Object.entries(porCat).sort((a, b) => b[1] - a[1]);

    document.getElementById('resumen').innerHTML = resumenOrden.length
      ? resumenOrden.map(([id, monto]) => {
          const c = cat(id);
          const pct = total ? Math.round(monto / total * 100) : 0;
          return `<div class="cat-resumen">
            <span class="ico">${c.ico}</span>
            <span class="nombre">${c.nombre}</span>
            <span class="pct">${pct}%</span>
            <span class="monto" style="margin-left:10px">${eur(monto)}</span>
          </div>`;
        }).join('')
      : '<div class="vacio">Aún no hay gastos</div>';

    // Historial
    document.getElementById('historial').innerHTML = gastos.length
      ? gastos.map(g => {
          const c = cat(g.categoria);
          const f = new Date(g.fecha);
          const fechaStr = f.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) +
            ' · ' + f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          return `<div class="item">
            <span class="ico">${c.ico}</span>
            <span class="info">
              <div class="concepto">${escapeHtml(g.concepto)}</div>
              <div class="fecha">${fechaStr}</div>
            </span>
            <span class="monto">${eur(g.importe)}</span>
            <button class="del" onclick="borrar(${g.id})">×</button>
          </div>`;
        }).join('')
      : '<div class="vacio">Aún no hay gastos</div>';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Enter en concepto añade a "Otros" rápido
  document.getElementById('concepto').addEventListener('keydown', e => {
    if (e.key === 'Enter') añadir('otros');
  });

  pintarCategorias();
  render();
</script>
</body>
</html>
