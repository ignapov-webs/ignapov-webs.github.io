<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mis Gastos</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #232733;
    --text: #f2f4f8;
    --muted: #8b93a7;
    --accent: #4f8cff;
    --danger: #ff5d5d;
    --warn: #ffb648;
    --ok: #34d399;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 50px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 14px; text-align: center; }

  .mes-bar { display: flex; justify-content: center; margin-bottom: 12px; }
  .mes-bar select {
    background: var(--card2); color: var(--text); border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 15px; outline: none;
  }

  .total-general {
    background: linear-gradient(135deg, #4f8cff, #6f5cff);
    border-radius: 18px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(79,140,255,.25);
  }
  .total-general .label { font-size: 13px; opacity: .85; }
  .total-general .valor { font-size: 38px; font-weight: 700; margin-top: 2px; }

  .form { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  input {
    width: 100%; background: var(--card2); border: none; border-radius: 12px;
    padding: 14px; color: var(--text); font-size: 17px; outline: none;
  }
  input::placeholder { color: var(--muted); }
  #importe { font-size: 20px; font-weight: 600; }

  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat-btn {
    background: var(--card2); border: 2px solid transparent; border-radius: 12px;
    padding: 12px 4px; color: var(--text); font-size: 13px; cursor: pointer;
    text-align: center; transition: .15s;
  }
  .cat-btn .ico { font-size: 22px; display: block; margin-bottom: 3px; }
  .cat-btn:active { transform: scale(.95); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 0; }

  section { margin-bottom: 18px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .sec-head h2 { font-size: 15px; color: var(--muted); margin: 0; font-weight: 600; }
  .sec-head .link { color: var(--accent); font-size: 13px; cursor: pointer; background: none; border: none; }

  .cat-resumen { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .cr-top { display: flex; align-items: center; }
  .cat-resumen .ico { font-size: 22px; margin-right: 12px; }
  .cat-resumen .nombre { flex: 1; font-size: 15px; }
  .cat-resumen .pct { color: var(--muted); font-size: 12px; margin-right: 10px; }
  .cat-resumen .monto { font-weight: 700; font-size: 16px; }
  .barra { height: 7px; background: var(--card2); border-radius: 5px; margin-top: 9px; overflow: hidden; }
  .barra > div { height: 100%; border-radius: 5px; transition: width .3s; }
  .presu-info { font-size: 11px; color: var(--muted); margin-top: 5px; }

  .item { display: flex; align-items: center; background: var(--card); border-radius: 12px; padding: 11px 14px; margin-bottom: 7px; }
  .item .ico { font-size: 20px; margin-right: 12px; }
  .item .info { flex: 1; min-width: 0; }
  .item .concepto { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .fecha { font-size: 11px; color: var(--muted); }
  .item .monto { font-weight: 600; margin: 0 10px; }
  .item .del { background: none; border: none; color: var(--danger); font-size: 20px; cursor: pointer; padding: 4px; }
  .vacio { text-align: center; color: var(--muted); padding: 20px; font-size: 14px; }

  /* Presupuestos */
  #presuPanel { display: none; background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 18px; }
  .presu-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .presu-row .ico { font-size: 20px; }
  .presu-row .nombre { flex: 1; font-size: 14px; }
  .presu-row input { width: 110px; padding: 10px; font-size: 15px; text-align: right; }

  .acciones { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
  .acciones button {
    background: var(--card); border: 1px solid var(--card2); color: var(--text);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  .acciones .reset { color: var(--danger); }
</style>
</head>
<body>
  <h1>💰 Mis Gastos</h1>

  <div class="mes-bar">
    <select id="selMes" onchange="render()"></select>
  </div>

  <div class="total-general">
    <div class="label" id="totalLabel">Total del mes</div>
    <div class="valor" id="totalGeneral">0,00 €</div>
  </div>

  <div class="form">
    <div class="row">
      <input id="importe" type="number" inputmode="decimal" placeholder="0,00 €" step="0.01">
    </div>
    <div class="row">
      <input id="concepto" type="text" placeholder="Concepto (ej. Café, Gasolina...)">
    </div>
    <div class="cats" id="cats"></div>
    <p class="hint">Escribe importe y concepto, luego toca una categoría</p>
  </div>

  <section>
    <div class="sec-head">
      <h2>RESUMEN POR CATEGORÍA</h2>
      <button class="link" onclick="togglePresu()">🎯 Presupuestos</button>
    </div>
    <div id="presuPanel"></div>
    <div id="resumen"></div>
  </section>

  <section>
    <div class="sec-head"><h2>HISTORIAL</h2></div>
    <div id="historial"></div>
  </section>

  <div class="acciones">
    <button onclick="exportarCSV()">⬇️ Exportar CSV</button>
    <button onclick="copiaSeguridad()">💾 Copia</button>
    <button onclick="document.getElementById('fileRestore').click()">♻️ Restaurar</button>
    <button class="reset" onclick="borrarTodo()">🗑️ Borrar todo</button>
    <input type="file" id="fileRestore" accept=".json" style="display:none" onchange="restaurar(event)">
  </div>

<script>
  const CATEGORIAS = [
    { id: 'comida',     nombre: 'Comida',     ico: '🍔' },
    { id: 'transporte', nombre: 'Transporte', ico: '🚗' },
    { id: 'ocio',       nombre: 'Ocio',       ico: '🎉' },
    { id: 'hogar',      nombre: 'Hogar',      ico: '🏠' },
    { id: 'salud',      nombre: 'Salud',      ico: '💊' },
    { id: 'otros',      nombre: 'Otros',      ico: '📦' },
  ];

  let gastos = JSON.parse(localStorage.getItem('gastos') || '[]');
  let presupuestos = JSON.parse(localStorage.getItem('presupuestos') || '{}');

  const eur = n => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const cat = id => CATEGORIAS.find(c => c.id === id) || CATEGORIAS[5];
  const claveMes = fechaISO => fechaISO.slice(0, 7); // "2026-06"
  const labelMes = clave => {
    const [a, m] = clave.split('-');
    const d = new Date(parseInt(a), parseInt(m) - 1, 1);
    const s = d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  };

  function guardar() {
    localStorage.setItem('gastos', JSON.stringify(gastos));
    localStorage.setItem('presupuestos', JSON.stringify(presupuestos));
  }

  function pintarCategorias() {
    document.getElementById('cats').innerHTML = CATEGORIAS.map(c =>
      `<button class="cat-btn" onclick="anadir('${c.id}')">
        <span class="ico">${c.ico}</span>${c.nombre}
      </button>`).join('');
  }

  function pintarMeses() {
    const sel = document.getElementById('selMes');
    const previo = sel.value;
    const meses = [...new Set(gastos.map(g => claveMes(g.fecha)))];
    const actual = new Date().toISOString().slice(0, 7);
    if (!meses.includes(actual)) meses.push(actual);
    meses.sort().reverse();
    let html = meses.map(m => `<option value="${m}">${labelMes(m)}</option>`).join('');
    html += `<option value="TODOS">📊 Todos los meses</option>`;
    sel.innerHTML = html;
    if (previo && [...sel.options].some(o => o.value === previo)) sel.value = previo;
    else sel.value = actual;
  }

  function anadir(catId) {
    const impInput = document.getElementById('importe');
    const conInput = document.getElementById('concepto');
    const importe = parseFloat(impInput.value.replace(',', '.'));
    const concepto = conInput.value.trim();

    if (!importe || importe <= 0) {
      impInput.focus();
      impInput.style.outline = '2px solid var(--danger)';
      setTimeout(() => impInput.style.outline = 'none', 800);
      return;
    }

    gastos.unshift({
      id: Date.now(), importe,
      concepto: concepto || cat(catId).nombre,
      categoria: catId, fecha: new Date().toISOString()
    });
    guardar();
    impInput.value = ''; conInput.value = ''; impInput.focus();
    pintarMeses();
    document.getElementById('selMes').value = new Date().toISOString().slice(0, 7);
    render();
  }

  function borrar(id) {
    gastos = gastos.filter(g => g.id !== id);
    guardar(); pintarMeses(); render();
  }

  function borrarTodo() {
    if (gastos.length && confirm('¿Borrar TODOS los gastos? No se puede deshacer.\n\n(Tus presupuestos se conservan)')) {
      gastos = []; guardar(); pintarMeses(); render();
    }
  }

  function togglePresu() {
    const p = document.getElementById('presuPanel');
    if (p.style.display === 'block') { p.style.display = 'none'; return; }
    p.innerHTML = '<div class="hint" style="margin-bottom:10px">Límite mensual por categoría (deja en blanco para no usar)</div>' +
      CATEGORIAS.map(c => `
        <div class="presu-row">
          <span class="ico">${c.ico}</span>
          <span class="nombre">${c.nombre}</span>
          <input type="number" inputmode="decimal" placeholder="—" value="${presupuestos[c.id] || ''}"
                 onchange="setPresu('${c.id}', this.value)">
        </div>`).join('');
    p.style.display = 'block';
  }

  function setPresu(catId, val) {
    const n = parseFloat(String(val).replace(',', '.'));
    if (!n || n <= 0) delete presupuestos[catId];
    else presupuestos[catId] = n;
    guardar(); render();
  }

  function render() {
    const sel = document.getElementById('selMes');
    const mes = sel.value || new Date().toISOString().slice(0, 7);
    const todos = mes === 'TODOS';
    const lista = todos ? gastos : gastos.filter(g => claveMes(g.fecha) === mes);

    const total = lista.reduce((s, g) => s + g.importe, 0);
    document.getElementById('totalGeneral').textContent = eur(total);
    document.getElementById('totalLabel').textContent = todos ? 'Total acumulado' : 'Total del mes';

    // Resumen por categoría
    const porCat = {};
    lista.forEach(g => porCat[g.categoria] = (porCat[g.categoria] || 0) + g.importe);
    const orden = Object.entries(porCat).sort((a, b) => b[1] - a[1]);

    document.getElementById('resumen').innerHTML = orden.length
      ? orden.map(([id, monto]) => {
          const c = cat(id);
          const pct = total ? Math.round(monto / total * 100) : 0;
          const lim = (!todos && presupuestos[id]) ? presupuestos[id] : null;
          let barra = '';
          if (lim) {
            const usado = Math.min(monto / lim * 100, 100);
            const ratio = monto / lim;
            const color = ratio > 1 ? 'var(--danger)' : ratio >= 0.8 ? 'var(--warn)' : 'var(--ok)';
            const restante = lim - monto;
            const txt = restante >= 0
              ? `Quedan ${eur(restante)} de ${eur(lim)}`
              : `⚠️ Te has pasado ${eur(-restante)} (límite ${eur(lim)})`;
            barra = `<div class="barra"><div style="width:${usado}%;background:${color}"></div></div>
                     <div class="presu-info" style="color:${ratio > 1 ? 'var(--danger)' : 'var(--muted)'}">${txt}</div>`;
          }
          return `<div class="cat-resumen">
            <div class="cr-top">
              <span class="ico">${c.ico}</span>
              <span class="nombre">${c.nombre}</span>
              <span class="pct">${pct}%</span>
              <span class="monto">${eur(monto)}</span>
            </div>${barra}
          </div>`;
        }).join('')
      : '<div class="vacio">No hay gastos en este periodo</div>';

    // Historial
    document.getElementById('historial').innerHTML = lista.length
      ? lista.map(g => {
          const c = cat(g.categoria);
          const f = new Date(g.fecha);
          const fechaStr = f.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) +
            ' · ' + f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          return `<div class="item">
            <span class="ico">${c.ico}</span>
            <span class="info">
              <div class="concepto">${escapeHtml(g.concepto)}</div>
              <div class="fecha">${fechaStr}</div>
            </span>
            <span class="monto">${eur(g.importe)}</span>
            <button class="del" onclick="borrar(${g.id})">×</button>
          </div>`;
        }).join('')
      : '<div class="vacio">No hay gastos en este periodo</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Exportar / Copia / Restaurar ----
  function descargar(nombre, contenido, tipo) {
    const blob = new Blob([contenido], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportarCSV() {
    if (!gastos.length) { alert('No hay gastos para exportar.'); return; }
    const filas = [['Fecha', 'Categoría', 'Concepto', 'Importe']];
    gastos.slice().reverse().forEach(g => {
      filas.push([
        new Date(g.fecha).toLocaleString('es-ES'),
        cat(g.categoria).nombre,
        g.concepto,
        String(g.importe).replace('.', ',')
      ]);
    });
    const csv = '﻿' + filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
    descargar('gastos.csv', csv, 'text/csv;charset=utf-8');
  }

  function copiaSeguridad() {
    const datos = JSON.stringify({ gastos, presupuestos, _exportado: new Date().toISOString() }, null, 2);
    descargar('copia-gastos.json', datos, 'application/json');
  }

  function restaurar(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (!Array.isArray(d.gastos)) throw new Error('Formato no válido');
        if (confirm(`¿Restaurar ${d.gastos.length} gastos desde la copia?\nEsto reemplazará los datos actuales.`)) {
          gastos = d.gastos;
          presupuestos = d.presupuestos || {};
          guardar(); pintarMeses(); render();
          alert('✅ Copia restaurada correctamente.');
        }
      } catch (err) {
        alert('❌ El archivo no es una copia válida.');
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  }

  // Enter en concepto añade a "Otros"
  document.getElementById('concepto').addEventListener('keydown', e => {
    if (e.key === 'Enter') anadir('otros');
  });

  pintarCategorias();
  pintarMeses();
  render();
</script>
</body>
</html>
